services:
  postgresql:
    image: timescale/timescaledb:latest-pg15
    container_name: owl-postgresql
    command:
      - postgres
      - -c
      - max_locks_per_transaction=256
      - -c
      - log_min_messages=warning
    environment:
      POSTGRES_DB: owl_v2           # 新库；首次启动自动 init dbv2 schema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../owlRD/dbv2:/docker-entrypoint-initdb.d
    networks:
      - owl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass TeLunSu-36kr --loglevel warning
    container_name: owl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - owl-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "TeLunSu-36kr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: owl-mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    networks:
      - owl-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1883"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  sleepace-mysql:
    image: mysql:5.7
    container_name: sleepace-mysql
    command: --general-log=0
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
    ports:
      - "3306:3306"
    volumes:
      - sleepace_mysql_data:/var/lib/mysql
      - ../sleepace/sql:/docker-entrypoint-initdb.d  # 添加SQL初始化脚本
    networks:
      - owl-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # sleepace-service（Java Tomcat）不放进 Docker，在宿主机运行；仅 MySQL、MQTT 用 Docker
  # 宿主机启动：cd ../sleepace/sleepace-service && ./bin/start.sh 等

  # ========================================================================
  # owl_v2 IPAM + DNS infrastructure
  # ========================================================================
  # kea-dhcp6: ISC kea DHCPv6 daemon (作 IPAM；owl 设备不直接 DHCP，由 owl
  #            service 通过 kea-ctrl-agent REST API 调用做 prefix delegation)
  # kea-ctrl-agent: kea REST API 入口
  # bind: BIND9 DNS server, 服务 owl namespace zones
  #       - 正向 zone tenant<N>.owl. (AAAA records)
  #       - 反向 zone d.0.0.f.ip6.arpa. (PTR records)
  # 详 ./kea/README.md

  # ----------------------------------------------------------------
  # kea-dhcp6 / kea-ctrl-agent — owl_v2 IPAM
  # ----------------------------------------------------------------
  # owl 设备本身走 IPv4+MQTT，不真发 DHCPv6 协议；kea 在 owl 体系里是
  # "lease database wrapper"，由 owl Go service 通过 ctrl-agent REST API
  # 调 lease6-add 占住 spatial slot，并触发 DDNS 推 BIND。
  #
  # 镜像：自构建（kea/Dockerfile）— 基于 ubuntu:22.04 + apt kea-2.0.2
  # （ISC 没发 docker hub 官方 kea 镜像，社区镜像质量参差，apt 最稳）

  kea-dhcp6:
    build: ./kea
    container_name: owl-kea-dhcp6
    command: kea-dhcp6 -c /etc/kea/kea-dhcp6.conf
    volumes:
      - ./kea/dhcp6:/etc/kea:ro
      - kea_lease_data:/var/lib/kea
    tmpfs:
      - /var/run/kea   # PID/lock 文件不持久化，避免 reboot 后 stale PID 卡死 daemon
    # owl 设备不真连 DHCPv6，547 不需对外（仅容器内监听）
    networks:
      - owl-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/kea/kea6-ctrl-socket || test -S /var/lib/kea/kea6-ctrl-socket"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  kea-ctrl:
    build: ./kea
    container_name: owl-kea-ctrl
    command: kea-ctrl-agent -c /etc/kea/kea-ctrl-agent.conf
    volumes:
      - ./kea/ctrl:/etc/kea:ro
      - kea_lease_data:/var/lib/kea
    tmpfs:
      - /var/run/kea   # PID/lock 文件不持久化，避免 reboot 后 stale PID 卡死 daemon
    ports:
      - "8000:8000"   # REST API 给宿主 owl-data service 调
    networks:
      - owl-net
    depends_on:
      kea-dhcp6:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  bind:
    image: internetsystemsconsortium/bind9:9.20
    container_name: owl-bind
    # entrypoint 切回 root 先 chown zones 给 bind，再用 bind user 启动 named
    # 否则 DDNS update 写 .jnl 失败 (zone 目录 owner=host user 1002)
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R bind:bind /etc/bind/zones &&
        exec /usr/sbin/named -u bind -f -c /etc/bind/named.conf -L /var/log/bind/default.log
    volumes:
      - ./bind/named.conf:/etc/bind/named.conf:ro
      - ./bind/zones:/etc/bind/zones        # DDNS update 要求 zone 目录可写（生成 .jnl）
      - ./bind/keys:/etc/bind/keys:ro       # DDNS 共享密钥（kea-ddns 同源）
      - bind_cache:/var/cache/bind
    # 主机 53 被 systemd-resolved 占；owl 内部 DNS 走 5353 端口
    # owl Go service 配 BIND_PORT=5353 走此
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
      - "9530:953/tcp"  # rndc 控制（避免主机端口冲突）
    networks:
      - owl-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  sleepace_mysql_data:
    driver: local
  redis_data:
    driver: local
  kea_lease_data:
    driver: local
  bind_cache:
    driver: local

networks:
  owl-net:
    driver: bridge
