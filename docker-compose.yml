version: '3.8'
services:
  postgresql:
    image: timescale/timescaledb:latest-pg15
    container_name: owl-postgresql
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_DB: owlrd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../owlRD/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine  
    command: redis-server --requirepass TeLunSu-36kr
    container_name: owl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: owl-mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1883"]
      interval: 10s
      timeout: 5s
      retries: 5

  wisefido-data:
    build:
      context: .
      dockerfile: ./wisefido-data/Dockerfile
    container_name: owl-wisefido-data
    ports:
      - "8080:8080"
    environment:
      # HTTP 配置
      - HTTP_ADDR=:8080
      # 数据库配置
      - DB_ENABLED=true
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=owlrd
      - DB_SSLMODE=disable
      # Redis 配置
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=TeLunSu-36kr
      - REDIS_DB=0
      # Doctor 配置（诊断功能）
      - DOCTOR_ENABLED=true
      - DOCTOR_PPROF=false
      # 日志配置
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      # 系统管理员种子
      - SEED_SYSADMIN=true
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sleepace-mysql:
    image: mysql:5.7
    container_name: sleepace-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
    ports:
      - "3306:3306"
    volumes:
      - sleepace_mysql_data:/var/lib/mysql
      - ../sleepace/sql:/docker-entrypoint-initdb.d  # 添加SQL初始化脚本
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  sleepace-service:
    build:
      context: ../sleepace
      dockerfile: Dockerfile
    container_name: sleepace-service
    ports:
      - "8090:8090"
      - "28070:28070"
      - "29010:29010"   
      #29010 device inital port  28070 device tcp long connect  8090 httpAPI
    volumes:
      - ../sleepace/sleepace-service/log:/var/wisefido/sleepace/sleepace-service/log
    depends_on:
      sleepace-mysql:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  sleepace_mysql_data:
    driver: local
  redis_data:
    driver: local