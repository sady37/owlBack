version: '3.8'

# wisefido-qinglan 独立部署 Docker Compose 配置
# 包含所有必需的依赖服务（PostgreSQL, Redis, MQTT）

services:
  # ========== wisefido-qinglan 服务 ==========
  wisefido-qinglan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wisefido-qinglan
    ports:
      - "8081:8081"   # HTTP API
      - "8443:8443"   # HTTPS 设备认证
    environment:
      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: owlrd
      DB_SSLMODE: disable

      # Redis配置
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: TeLunSu-36kr
      REDIS_DB: 0

      # MQTT配置（qinglan连接的broker）
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: wisefido-qinglan
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""

      # 雷达设备MQTT配置（返回给设备的配置）
      # ⚠️ 重要：RADAR_MQTT_SERVER 必须是设备能访问的地址
      # 如果设备在外网，需要改为服务器的公网IP或域名
      RADAR_MQTT_SERVER: 10.0.0.30        # 改为实际的MQTT服务器地址
      RADAR_MQTT_PORT: 8883                # 设备访问的MQTT端口
      RADAR_MQTT_ACCOUNT: wfiot
      RADAR_MQTT_PASSWORD: tt@wf@2025
      RADAR_MQTT_PROTOCOL: "1"             # 1=不加密, 2=加密
      RADAR_MQTT_PRODUCT_ID: "88"
      RADAR_MQTT_TIMEOUT: 30
      RADAR_MQTT_KEEPALIVE: 60

      # HTTP配置
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8081

      # HTTPS配置（可选，如果不需要设备认证可以设置为0）
      HTTPS_PORT: 8443
      HTTPS_CERT_FILE: /certs/server.crt
      HTTPS_KEY_FILE: /certs/server.key

      # 日志配置
      LOG_LEVEL: info

    volumes:
      # 挂载证书目录（用于HTTPS）
      - ./certs:/certs:ro
      # 如果使用配置文件而不是环境变量
      # - ./config.yaml:/app/config.yaml:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - owlback-network

  # ========== PostgreSQL + TimescaleDB ==========
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: owlback-postgres
    environment:
      POSTGRES_DB: owlrd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 如果有初始化SQL脚本，可以挂载到这里
      # - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - owlback-network

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: owlback-redis
    command: redis-server --requirepass TeLunSu-36kr --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "TeLunSu-36kr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - owlback-network

  # ========== MQTT Broker (Mosquitto) ==========
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: owlback-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "8883:8883"   # MQTT over TLS
      - "9001:9001"   # WebSocket
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # 如果使用TLS，挂载证书
      # - ./mosquitto/certs:/mosquitto/config/certs:ro
    restart: unless-stopped
    networks:
      - owlback-network

  # ========== PostgreSQL 管理工具 pgAdmin (可选) ==========
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: owlback-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - owlback-network
    profiles:
      - tools  # 使用 profile 控制是否启动

  # ========== Redis 管理工具 RedisInsight (可选) ==========
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: owlback-redis-insight
    ports:
      - "8001:8001"
    volumes:
      - redis_insight_data:/db
    restart: unless-stopped
    networks:
      - owlback-network
    profiles:
      - tools  # 使用 profile 控制是否启动

# ========== 数据卷 ==========
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  pgadmin_data:
    driver: local
  redis_insight_data:
    driver: local

# ========== 网络 ==========
networks:
  owlback-network:
    driver: bridge
