# Mosquitto MQTT Broker 配置文件
# 用于 wisefido-qinglan 独立部署

# ========== 监听配置 ==========
# 非加密连接
listener 1883
protocol mqtt

# TLS加密连接（可选）
# listener 8883
# protocol mqtt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# cafile /mosquitto/config/certs/ca.crt
# tls_version tlsv1.2

# WebSocket连接（可选）
listener 9001
protocol websockets

# ========== 安全配置 ==========
# 允许匿名连接（开发环境）
allow_anonymous true

# 生产环境建议启用密码认证
# allow_anonymous false
# password_file /mosquitto/config/passwd

# ========== 日志配置 ==========
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# 详细日志（调试用）
# log_type all

# ========== 持久化配置 ==========
persistence true
persistence_location /mosquitto/data/

# ========== 连接配置 ==========
# 最大连接数
max_connections -1

# 保持连接超时
max_keepalive 65535

# ========== 消息配置 ==========
# 最大消息大小（字节）
message_size_limit 10485760

# 队列大小
max_queued_messages 1000

# ========== ACL 配置（可选）==========
# 访问控制列表
# acl_file /mosquitto/config/acl

# ========== 示例 passwd 文件生成命令 ==========
# 使用以下命令生成密码文件：
# mosquitto_passwd -c /path/to/passwd username

# ========== 示例 acl 文件内容 ==========
# # 用户 wfiot 可以订阅和发布所有主题
# user wfiot
# topic readwrite #
#
# # 用户 readonly 只能订阅
# user readonly
# topic read #
