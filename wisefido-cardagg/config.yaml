database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "owl_v2"
  sslmode: "disable"

redis:
  addr: "127.0.0.1:6379"
  password: "TeLunSu-36kr"
  db: 0

logging:
  level: "info"
  format: "text"
  output: "stdout"
  filepath: "/var/log/wisefido-cardagg.log"

streams:
  default:
    max_len: 1000
    retention_seconds: 86400

# AI 派生 track verdict 合并行为（S5a AIOverrideCache）。
# 部署约定（域名区分）：
#   test.wisefido.com  → sandbox（仅 log，不动 track_confidence）
#   owl.wisefido.com   → release（覆写 track_confidence + ai_source）
# env override：CARDAGG_AI_OVERRIDE_MODE
ai:
  override_mode: "sandbox"
  override_ttl_sec: 60

# display 重建：事件驱动是主路径（sensor RoomState 变化即触发 sensor_state_projector.Rebuild）；
# 本 ticker 是 keep-alive 兜底（5min 无 event 也强推一次，防 FE 长时间静默）。
display:
  rebuild_interval_sec: 300
