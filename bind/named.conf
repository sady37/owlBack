// named.conf
//
// BIND9 主配置 — owl_v2 DNS infrastructure
//
// 服务范围：
//   1. 正向 zone：tenant<N>.owl. (各 tenant 一个 zone)
//   2. 反向 zone：d.0.0.f.ip6.arpa. (fd00::/8 ULA 范围)
//
// 启用 DDNS update（kea-ddns 推送 / owl service 推送 via nsupdate）

options {
    directory "/var/cache/bind";
    listen-on-v6 { any; };
    listen-on    { any; };

    // owl 内部 DNS（不递归外部）
    recursion no;
    allow-query { any; };

    // 不暴露版本信息
    version "owl-bind";

    // DNSSEC 暂不启用（开发环境）
    dnssec-validation no;
};

// DDNS 共享密钥（kea-ddns + owl service 用此 TSIG 推 update）
include "/etc/bind/keys/ddns-update.key";

// =========================================================================
// owl_v2 zones
// =========================================================================

// 正向 zone — 每 tenant 一个，按 tenant_slot 命名 (与 PG tenants.tenant_slot 1:1)
// 加 zone 后需 docker exec owl-bind rndc reload；BE reconcile 用 hash 短码作 owner，
// FQDN 形如 "<short>.tenant<N>.owl."（其中 <short> = 6 位 base36 SHA256 hash of spatial_prefix）
zone "tenant1.owl" { type master; file "/etc/bind/zones/tenant1.owl.zone"; allow-update { key ddns-update; }; };
zone "tenant2.owl" { type master; file "/etc/bind/zones/tenant2.owl.zone"; allow-update { key ddns-update; }; };
zone "tenant3.owl" { type master; file "/etc/bind/zones/tenant3.owl.zone"; allow-update { key ddns-update; }; };
zone "tenant4.owl" { type master; file "/etc/bind/zones/tenant4.owl.zone"; allow-update { key ddns-update; }; };
zone "tenant5.owl" { type master; file "/etc/bind/zones/tenant5.owl.zone"; allow-update { key ddns-update; }; };
zone "tenant7.owl" { type master; file "/etc/bind/zones/tenant7.owl.zone"; allow-update { key ddns-update; }; };
zone "tenant99.owl" { type master; file "/etc/bind/zones/tenant99.owl.zone"; allow-update { key ddns-update; }; };

// 反向 zone — owl B2B namespace = fd00:0000::/32
// 反向 nibble 顺序：forward "f d 0 0 0 0 0 0" → reverse labels "0 0 0 0 0 0 d f"
zone "0.0.0.0.0.0.d.f.ip6.arpa" {
    type master;
    file "/etc/bind/zones/d.0.0.f.ip6.arpa.zone";
    allow-update { key ddns-update; };
};
