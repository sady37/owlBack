service:
  ip: 
  port: "9005"
  domain:
  mode: "debug"
  name: "wisefido-sleepace"

logger:
  path: "/var/wisefido/backend/log/sleepace.log"
  rotation_count: 10
  level: debug

database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "env(MYSQL_PASSWORD)"
  database: "wisefido"
  default_size: 20
  max_size: 100

redis:
  address: "localhost:6379"
  password: "env(REDIS_AUTH)"
  db: 1

mqtt:
  address: "mqtt://47.90.180.176:1883"
  username: "wisefido"
  password: "env(MQTT_PASSWORD)" # "vVYxo*.XCh-FjVC2VtrU"
  client_id: "wisefido-sleepace-test"
  topic_id: "sleepace-57136"

sleepace:
  http_address: "http://47.90.180.176:8080"
  # mqtt_address: "mqtt://47.90.180.176:1883"
  # mqtt_username: "wisefido"
  # mqtt_password: "env(MQTT_PASSWORD)" # "vVYxo*.XCh-FjVC2VtrU"
  # mqtt_client_id: "wisefido-sleepace-test"
  app_id: "57136"
  channel_id: "57136"
  # topic_id: "sleepace-57136"
  secret_key: "env(SLEEPACE_SECRET_KEY)"
  timezone: -21600 #-6*60*60
  realtime_interval: 10
  leave_sensibility: 1
  report_upload_type: 0
  report_upload_time: 10

services:
  user: "http://localhost:9001/wisefido/user/api/v1"
  device: "http://localhost:9002/wisefido/device/api/v1"
  resident: "http://localhost:9003/wisefido/resident/api/v1"
  address: "http://localhost:9004/wisefido/address/api/v1"
  sleepace: "http://localhost:9005/wisefido/sleepace/api/v1"
  qinglan: "http://localhost:9006/wisefido/qinglan/api/v1"
  data: "http://localhost:9007/wisefido/data/api/v1"
