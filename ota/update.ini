# =============================================================
# OTA 固件目录命名规范（owl/owlBack/ota）
# =============================================================
# 固件 bin 文件名格式：
#   <类型>_<厂商>_<部件>[_<硬件型号>]_v<版本>_<日期>.bin
#
#   类型     fw | mcu             （fw=雷达固件, mcu=MCU 固件）
#   厂商     qinglan | ...        （小写）
#   部件     radar | esp32 | ...
#   硬件型号 HC2 | ...             （可选，大写；无则省略该段）
#   版本     v2.3 / v2.0 ...       （v 前缀，主.次；必要时可加补丁）
#   日期     YYYYMMDD              （8 位，勿加前导 0 以外的多余字符）
#
# 分隔符仅用 "_"；不使用 "-" / "@" / 中文 / 空格。
# 版本号内部保留 "."（不要拆成 "v2_3"）。
#
# 串口日志 txt：log_<来源>_<COM>_<波特率>_<MAC>_<YYYYMMDD>_<HHMMSS>.txt
#
# 每个 bin 在本文件必须有一个 section：
#   file:<完整文件名>
#   espsfver	<MCU 版本>               ← 解析，用于 MQTT espver 字段
#   ESPFileSize	<字节数>                 ← 本地文件 size 为准，此行保留便于人读
#   ESPFileSHA256	<十六进制，小写>     ← 本地计算为准，此行保留便于人读
#   radarsfver	<雷达版本>               ← 解析
#   app_compile_time	<MM/DD/YY HH:MM>  ← 设备协议字段，格式固定（见下）
#
# 字段分隔用 Tab；key 必须与解析器识别名一致。
#
# 日期两处的关系与约束：
#   - 文件名末尾的 YYYYMMDD：自由命名，代表固件版本日期，应等于编译日
#   - app_compile_time 的 MM/DD/YY HH:MM：设备协议字段（见 docs/Radar_MQTT_v3.0.md §3.8.4.1）
#     是 MCU 固件内 __DATE__/__TIME__ 编译时固化的字符串；设备 OTA 后上报该值，
#     服务器用它和本行比对判定升级成功。格式由固件决定，**不得改写**，否则匹配失败。
#   两处日期值必须对应同一天（文件名 YYYYMMDD 与 app_compile_time 的 MM/DD/YY 同日）。
#
# 修改 bin 必须同步本文件，且同步 device_store.ota_target_mcu_model / ota_target_firmware_version 中的文件名引用。
# =============================================================

