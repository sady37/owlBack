// 清澜雷达 V2.2 TCP协议 Protobuf定义
// 来源: 清澜雷达设备对接V2.2(wifi).md 第3.2节 + Java Demo (device_point)
// 帧格式: [2字节Length(LE)][1字节type][protobuf data]
// Length = len(data), 不包括Length和type本身

syntax = "proto3";

package qinglan;

option go_package = "ota-ql-server/proto/gen";

// ========== 调度阶段 (type 1→2) ==========

// type 1: 设备请求获取服务器IP (设备→服务器)
message GetServerReq {
    uint32 seq = 1;    // 包序列号
    string uid = 2;    // 设备UID，设备唯一标识
    string type = 3;   // 设备类型: TSL60G442(WiFi HC2/TK2), TSL60G4G(4G HC2)
}

// type 2: 获取服务器IP响应 (服务器→设备)
message GetServerResponse {
    uint32 seq = 1;    // 包序列号
    int32  result = 2; // 0:成功，其它:失败
    string server = 3; // 服务器域名或IP
    uint32 port = 4;   // 服务器端口
    string addon = 5;  // 可选，服务器附加信息
    string errmsg = 6; // 可选，错误信息
}

// ========== 注册阶段 (type 3→4) ==========

// type 3: 设备注册 (设备→服务器)
message RegisterReq {
    uint32 seq = 1;      // 包序列号
    string hwver = 2;    // 硬件版本号，当前固定2.0
    string sfver = 3;    // 软件版本号: HC2=2.0, TK2=2.6
    string addon = 4;    // 附加信息，当前为空
    string uid = 5;      // 设备UID
    string type = 6;     // 设备型号，同type 1
    string name = 7;     // 设备名称，固定"qinglan"
    string location = 8; // 设备位置信息，固定"shenzhen"
}

// type 4: 注册响应 (服务器→设备)
message RegisterResponse {
    uint32 seq = 1;    // 包序列号
    int32  result = 2; // 0:成功，其它:失败
    string addon = 3;  // 可选，返回的附加信息
    string errmsg = 4; // 可选，错误信息
}

// ========== 心跳 (type 7→8, type 28→29) ==========

// type 7: 设备心跳请求 (设备→服务器)
// type 8: 心跳响应 (服务器→设备)
// type 24: 重启设备 (服务器→设备)，seq=0:整机, 1:只重启雷达, 2:只重启主控
message CommonMessage {
    uint32 seq = 1; // 包序列号
}

// type 4/10/17/25/27/51/53 通用响应
message CommonResponse {
    uint32 seq = 1;    // 包序列号
    int32  result = 2; // 0:成功, 非0:失败
    string errmsg = 3; // 可选，失败时的错误信息
}

// ========== 跌倒告警 (type 5) ==========

// type 5: 设备上报跌倒告警 (设备→服务器)
message ObjectFallDown {
    bytes  falls = 1;    // 跌倒数据序列(2字节: [目标ID][跌倒状态0/1/2])
    uint32 seconds = 2;  // 1970/1/1开始的秒数
    int32  mseconds = 3; // 毫秒
}

// ========== 设备属性配置 (type 9→10) ==========

// type 9: 设置设备属性 (服务器→设备)
message SetDeviceProperty {
    uint32 seq = 1;   // 包序列号
    string key = 2;   // 属性key
    string value = 3; // 属性值
}

// ========== 设备属性获取 (type 11→12) ==========

// type 11: 获取设备属性 (服务器→设备) — 空消息，仅type字节

// type 12: 获取设备属性响应 (设备→服务器)
message ProPertyItem {
    string key = 1;   // 属性key
    string value = 2; // 属性值
}

message ProPertyItems {
    repeated ProPertyItem Properties = 1; // 多个属性列表
}

// ========== 实时数据上报 ==========

// type 13: 实时轨迹上报 (设备→服务器)
// type 14: 呼吸心率/睡眠数据上报 (设备→服务器)
// type 16: 人数变化上报 (设备→服务器), data[0]=当前人数
// type 19: 轨迹统计数据上报 (设备→服务器)
message ObjectData {
    bytes data = 1;      // 数据内容(各type含义不同)
    int32 seconds = 2;   // 1970/1/1开始的秒数
    int32 mseconds = 3;  // 毫秒
}

// ========== 进出事件上报 (type 15) ==========

// type 15: 进出事件上报 (设备→服务器)
message PositionStatusEvent {
    bytes  events = 1;   // 事件信息(8字节，对应8个人)
    bytes  areas = 2;    // 进出区域信息(16字节)
    uint32 seconds = 3;  // 1970/1/1开始的秒数
    int32  mseconds = 4; // 毫秒
}

// ========== OTA升级 (type 16→17→18) ==========

// type 16: OTA推送 (服务器→设备)
// 注意: type 16双用！设备→服务器=人数变化(ObjectData)，服务器→设备=OTA推送(OTAReq)
message OTAReq {
    uint32 seq = 1;
    string espsfver = 2;       // 主控版本: HC2=2.0, TK2=2.6
    string ESPFileUrl = 3;     // 通讯固件URL(http/https), 最大250字节
    uint32 ESPFileSize = 4;    // 通讯固件大小(字节), 最大2MB
    string ESPFileSHA256 = 5;  // 通讯固件SHA256校验值
    string radarsfver = 6;     // 雷达版本: 1.0或2.3
    string RadarFileUrl = 7;   // 雷达固件URL, 最大250字节
    uint32 RadarFileSize = 8;  // 雷达固件大小(字节), 最大500KB
    string RadarFileSHA256 = 9;// 雷达固件SHA256校验值
}

// type 17: OTA推送响应 (设备→服务器)
// 使用 CommonResponse
// 错误码: 1=ota进行中, 2=解码失败, 3=主控版本不匹配, 4=主控固件大小错误, 5=雷达固件大小错误, 6=雷达版本不匹配

// type 18: OTA进度反馈 (设备→服务器)
message OTAProgress {
    int32  progress = 1; // -1=错误, 10=雷达下载完成, 25=雷达升级完成, 56=通讯下载完成, 100=通讯升级完成
    string errMsg = 2;   // 失败时的错误信息
}

// ========== 订阅实时数据 (type 26→27) ==========

// type 26: 订阅实时呼吸心率和轨迹 (服务器→设备)
message SetModeReq {
    uint32 seq = 1;
    uint32 seconds = 2; // 订阅有效期(1-3600秒)
}

// ========== VoIP通话 (type 50→51, 52→53) ==========

// type 50: 启动通话 (服务器→设备)
message StartVoiceReq {
    uint32 seq = 1;
    string appid = 2;       // 通话参数
    string license = 3;     // 通话参数
    string token = 4;       // 通话参数
    string channelName = 5; // 通话参数
}

// type 51: 启动通话响应 — 使用独立消息（Java Demo区分）
message StartVoipResponse {
    uint32 seq = 1;
    int32  result = 2; // 0:成功, 1:通话中, 2:启动失败
    string errmsg = 3;
}

// type 52: 停止通话 (服务器→设备) — 空消息

// type 53: 停止通话响应
message StopVoipResponse {
    uint32 seq = 1;
    int32  result = 2; // 0:成功, 2:停止失败
    string errmsg = 3;
}

// type 17: OTA响应 — 使用独立消息（Java Demo区分）
message OtaResponse {
    uint32 seq = 1;
    int32  result = 2;
    string errmsg = 3;
}

// ========== 通知消息 (type 35) ==========

// type 35: 设备调试信息 (设备→服务器) — 内部保留
message NotifyMessage {
    string message = 1;
}

// ========== Java Demo额外定义 ==========

// 轨迹数据（Java Demo中的PositionData，对应type 13）
message PositionData {
    bytes data = 1;
    int32 seconds = 2;
    int32 mseconds = 3;
}

// 人数数据（Java Demo中的NumberOfPeopleData，对应type 16设备方向）
message NumberOfPeopleData {
    bytes data = 1;
    int32 seconds = 2;
    int32 mseconds = 3;
}

// 轨迹统计报告（Java Demo中的PositionStatisticReport，对应type 19）
message PositionStatisticReport {
    bytes data = 1;
    int32 seconds = 2;
    int32 mseconds = 3;
}

// type 10: 设置属性响应（Java Demo中单独定义）
message SetPropResponse {
    uint32 seq = 1;
    int32  result = 2;
    string errmsg = 3;
}
