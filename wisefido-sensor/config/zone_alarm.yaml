# zone_alarm.yaml — zonealarm state-anchored 派生规则配置
#
# 3 条 alarm 同 shape：每条声明 anchor entity + anchor_field（计时起点 ts）+
# keep_counting 条件（state-change-anchored 维持有效）+ 阈值（day/night 双档）。
#
# Tick 模式：sensor wiring 1s ticker 喂 Supervisor.Tick → 5s coalesce RiskLevel
# refresh + 每 tick Evaluator.Check 比阈值；fire-once-until-anchor-invalidates
# 语义 — keep_counting 任一不满足即清 fired，条件复成立从 anchor 重新计。
#
# AlarmType 与 owl-common/alarm 常量对齐（cardagg alarm_handler 接收侧识别）。
# Stay 阈值 = owl-common/card/risk_thresholds.go BathroomAlone（与 cardagg display
# RiskLevel 共用同一份阈值，避免 sensor/cardagg 漂移）。

rules:
  # ============================================================
  # 1. Stay — bathroom 独居超阈（仅 1 人才算滞留；caregiver 协助清零）
  # ============================================================
  - alarm_type: Stay
    level: WARNING
    anchor: bathroom
    anchor_field: AloneContinuousMin
    keep_counting:
      - {state: alone}                       # Self=bathroom 必须 TotalPeople==1
    threshold_day_sec: 2700                  # 45 min（card.BathroomAlone.DayRiskMin）
    threshold_night_sec: 1800                # 30 min（card.BathroomAlone.RiskTimeRiskMin）

  # ============================================================
  # 2. LeftBed — 离床 30min + 同 /88 room 也得空（人回房算回床）
  # ============================================================
  - alarm_type: LeftBed
    level: WARNING
    anchor: bed
    anchor_field: BedStatusTs
    keep_counting:
      - {state: vacant}                      # Self=bed Vacant (NotInBed)
      - {entity: room, state: vacant}        # 同 /88 room 也得空（人未回房）
    threshold_day_sec: 1800                  # 30 min

  # ============================================================
  # 3. NightAbsence — room 空 30min + 21-7 时段 + bed 也得空
  # ============================================================
  - alarm_type: NightAbsence
    level: WARNING
    anchor: room
    anchor_field: LastExitTs
    keep_counting:
      - {state: vacant}                      # Self=room Vacant
      - {entity: bed, state: vacant}         # 同 /88 内所有 bed 也空
    threshold_day_sec: 1800                  # 30 min
    night_only: {start_h: 21, start_m: 0, end_h: 7, end_m: 0}
