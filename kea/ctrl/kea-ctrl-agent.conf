// kea-ctrl-agent.conf
//
// kea REST API 入口；owl Go services 通过 HTTP POST 调用 kea 命令。
//
// 端口：8000（容器外暴露相同）
// 协议：JSON over HTTP
// 鉴权：开发环境 basic auth（production 用 mTLS / API token）

{
"Control-agent": {
    "http-host": "0.0.0.0",
    "http-port": 8000,

    // 控制目标：kea-dhcp6 daemon（通过共享 unix socket）
    "control-sockets": {
        "dhcp6": {
            "socket-type": "unix",
            "socket-name": "/var/lib/kea/kea6-ctrl-socket"
        }
    },

    // 鉴权（开发环境）
    // 注：kea 2.0 不支持 authentication.directory + password-file 字段
    // 这里改为 inline password (dev only；生产必须 mTLS / token，且把 8000 关到 owl-net 内)
    "authentication": {
        "type": "basic",
        "realm": "owl-kea-ctrl",
        "clients": [
            {
                "user": "owl",
                "password": "owl-kea-dev-2026"
            }
        ]
    },

    // 日志
    "loggers": [
        {
            "name": "kea-ctrl-agent",
            "output_options": [{ "output": "stdout" }],
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}
}
