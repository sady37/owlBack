// kea-dhcp6.conf
//
// owl_v2 IPAM 配置（仅作 prefix allocator，owl 设备不真发 DHCPv6 请求）
//
// 模式：
//   - kea 监听 547/udp 但 owl 设备不连接
//   - owl Go service 通过 kea-ctrl-agent REST API 调 subnet6-add / lease6-add
//   - kea 维护 lease 状态 + 触发 DDNS 推 BIND

{
"Dhcp6": {
    // 监听接口（容器内：所有接口）
    "interfaces-config": {
        "interfaces": [ "*" ]
    },

    // Lease backend：内存 + 文件持久化（owl 量级用 memfile 足够）
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases6.csv",
        "lfc-interval": 3600
    },

    // hooks：lease_cmds 开放 lease6-add/get/del REST API（开源 hook，免费）
    "hooks-libraries": [
        {
            "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
        }
    ],

    // Control socket：让 ctrl-agent 调用
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "/var/lib/kea/kea6-ctrl-socket"
    },

    // owl_v2 namespace 根 prefix（owl B2B = fd00:0000::/32）
    // 实际 subnets 在运行时由 kea REST API 动态添加
    "preferred-lifetime": 3600,
    "valid-lifetime": 7200,
    "renew-timer": 1000,
    "rebind-timer": 2000,

    // owl B2B namespace 全覆盖：fd00:0000::/32（含所有 tenant /48）
    // 单 subnet 覆盖整空间 + pd-pools 允许 lease6-add 任意 sub-prefix（branch /56 / unit /80 / bed /96 / device /128）
    // ID=1 是 platform-level subnet；owl service 通过 lease6-add 注入实际分配
    //
    // 注：owl 设备不真发 DHCPv6 协议，kea 在 owl 体系里仅作 IPAM lease audit
    // 因此 subnet 不绑接口（去掉 interface 字段）
    "subnet6": [
        {
            "id": 1,
            "subnet": "fd00:0000::/32",
            "comment": "owl B2B namespace; lease6-add 任意 sub-prefix",
            "pd-pools": [
                {
                    "prefix": "fd00:0000::",
                    "prefix-len": 32,
                    "delegated-len": 56
                }
            ]
        }
    ],

    // DDNS：lease 变化时通知 BIND（kea-ddns 服务）
    "dhcp-ddns": {
        "enable-updates": false,
        "comment": "Phase B 启用 DDNS 联动 BIND；当前先保持 false 让 owl service 显式管 zone"
    },

    // 日志
    "loggers": [
        {
            "name": "kea-dhcp6",
            "output_options": [{ "output": "stdout" }],
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}
}
