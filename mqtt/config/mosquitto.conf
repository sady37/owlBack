# Mosquitto MQTT Broker 配置文件

# 不加密端口（MQTT）
listener 1883
allow_anonymous true

# TLS 加密端口（MQTTS）
listener 8883
allow_anonymous true
# 自签名证书：使用同一个证书文件作为 CA 和服务器证书
certfile /mosquitto/config/fullchain.pem
keyfile /mosquitto/config/privkey.pem
require_certificate false

# 日志：stdout 由 Docker json-file 轮转；勿用 log_type all（量极大）
log_dest stdout
connection_messages true

# 持久化
persistence true
persistence_location /mosquitto/data/

# WebSocket 支持（端口 9001）
listener 9001
protocol websockets

